name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  flutter_test:
    name: Run flutter analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # assets/data points at lucas-goldner/Storage, which is private.
          # The default GITHUB_TOKEN is scoped to this repository only, so a
          # PAT with read access to Storage is needed to clone it.
          token: ${{ secrets.SUBMODULE_TOKEN }}
      - name: Flutter get
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: dart run custom_lint
      - run: flutter test
